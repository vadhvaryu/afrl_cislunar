# Scenario for the IOD -> estimation -> propagation -> results stack.
# Swap a module by changing one name below (or with --iod / --propagator).
# Each module ignores settings meant for other modules.

system:                 # must match obs_generator.py
  mu: 0.0121505
  du_km: 384338.0
  tu_s: 375099.0

data:
  observations: data/synthetic_obs.csv
  truth: data/synthetic_truth.csv      # answer key; remove for real data

iod:
  method: truth_plus_error             # truth_plus_error (test stand-in) | gooding | gauss | laplace

  # gooding / gauss / laplace (Orekit, two-body)
  obs_indices: [0, 2, 4]               # which 3 observations to use
  range_guess_km: [350000, 350000]     # gooding only: guessed distance at obs 1 and 3

  # truth_plus_error (reads the answer key; for testing the rest of the stack only)
  epoch_index: 2                       # which observation time the estimate is at
  position_error_km: 1000
  velocity_error_m_s: 10
  seed: 0

estimation:
  method: orekit_bls                   # orekit_bls | orekit_bls_robust | multiple_shooting | multiple_shooting_then_bls | ukf | none
  max_iterations: 50
  max_evaluations: 100
  convergence_threshold: 0.001         # Orekit's normalized-parameter convergence threshold
  position_scale_m: 1.0                # scale Orekit normalizes position by (threshold applies to that)
  gate_rms: null                       # e.g. 3: reject fits with residual RMS above 3 sigma (off by default)
  # orekit_bls_robust only (see od_stack/estimation.py):
  short_arc: [1, 2, 3]                 # fit these observations first, then all
  restart_offsets_km: [10000, -10000, 20000, -20000]   # restarts along the line of sight
  robust_gate_rms: 3.0                 # a full fit counts only below this residual RMS (sigma)

propagator:
  method: orekit_cr3bp                 # orekit_cr3bp | cr3bp | keplerian

output:
  dir: results
  dense_points: 800
  propagate_covariance: true           # carry the BLS covariance over the whole span (12 extra propagations)
  confidence_level: 0.95               # size of the confidence region reported in summary.json

sweeps:                                # python -m od_stack.sweep   (Monte Carlo; see od_stack/sweep.py)
  dir: results/sweeps
  seeds: 20                            # runs per setting
  noise_arcsec: [0.3, 1, 3, 10, 30, 100, 300, 1000, 3000]
  iod_position_error_km: [100, 1000, 10000, 30000, 100000]
  velocity_per_position_error: 0.01    # m/s of IOD velocity error per km of position error (1,000 km -> 10 m/s)
  noise_sweep_iod_error_km: 1000       # IOD error held fixed during the noise sweep
  iod_sweep_noise_arcsec: 10           # noise held fixed during the IOD-error sweep
  converged_if_error_below_km: 1000    # BLS "converged" = finished AND landed this close to truth ...
  threshold_reference_noise_arcsec: 10 # ... scaled up by noise / 10" above 10" (good-fit error grows with noise)
  check_points: 100                    # times used to measure max error over the span

orekit:
  data_path: null                      # path to orekit-data (needed by orekit_bls),
                                       # or leave null and set the OREKIT_DATA environment variable
